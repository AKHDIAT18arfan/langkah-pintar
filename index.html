<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Langkah Pintar - Belajar Algoritma untuk Anak SD" />
  <title>Langkah Pintar - Belajar Algoritma</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&family=Space+Mono:wght@400;700&display=swap" />

  <link rel="stylesheet" href="/src/styles/variables.css" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/game.css" />
  <link rel="stylesheet" href="/src/styles/materi.css" />
  <link rel="stylesheet" href="/src/styles/theme.css" />
</head>
<body>
  <button id="theme-toggle" aria-label="Ganti tema">☀</button>
  <div id="app"></div>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      try {
        var saved = localStorage.getItem('lp_theme');
        if (saved) root.setAttribute('data-theme', saved);
      } catch (e) {}
      function isDark() {
        var t = root.getAttribute('data-theme');
        return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
      }
      btn.textContent = isDark() ? '☾' : '☀';
      btn.onclick = function () {
        var next = isDark() ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        btn.textContent = next === 'dark' ? '☾' : '☀';
        try { localStorage.setItem('lp_theme', next); } catch (e) {}
      };
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
